```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛏️ Petualangan Tambang</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    h1 {
        margin: 15px 0 5px;
        color: #fbbf24;
    }

    #info {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin: 10px;
        font-size: 18px;
    }

    #game {
        position: relative;
        width: 900px;
        height: 550px;
        max-width: 95vw;
        margin: auto;
        border: 5px solid #78350f;
        border-radius: 15px;
        overflow: hidden;

        background:
            radial-gradient(circle at 20% 20%, #92400e 0 4px, transparent 5px),
            radial-gradient(circle at 70% 60%, #451a03 0 5px, transparent 6px),
            radial-gradient(circle at 40% 80%, #78350f 0 4px, transparent 5px),
            #422006;

        background-size: 100px 100px;
    }

    #player {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #facc15;
        border: 3px solid #92400e;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        z-index: 5;
    }

    .rock {
        position: absolute;
        width: 55px;
        height: 55px;
        background: #57534e;
        border: 4px solid #292524;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        cursor: pointer;
        box-shadow: inset 0 0 8px #111;
    }

    .gold {
        background: #d97706;
        border-color: #fbbf24;
    }

    .diamond {
        background: #0891b2;
        border-color: #67e8f9;
    }

    .coal {
        background: #292524;
        border-color: #78716c;
    }

    #message {
        margin-top: 10px;
        font-size: 18px;
        color: #fde68a;
    }

    #shop {
        margin-top: 10px;
    }

    button {
        background: #f59e0b;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        margin: 4px;
    }

    button:hover {
        background: #fbbf24;
    }

    #gameOver {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 20;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    #gameOver h2 {
        color: #fbbf24;
        font-size: 40px;
    }
</style>
</head>

<body>

<h1>⛏️ PETUALANGAN TAMBANG</h1>

<div id="info">
    <div>💰 Uang: <span id="money">0</span></div>
    <div>🪨 Batu: <span id="stone">0</span></div>
    <div>🟡 Emas: <span id="gold">0</span></div>
    <div>💎 Berlian: <span id="diamond">0</span></div>
</div>

<div id="game">

    <div id="player">⛏️</div>

    <div class="rock" data-type="stone" style="left:100px;top:100px;">🪨</div>
    <div class="rock" data-type="stone" style="left:250px;top:180px;">🪨</div>
    <div class="rock gold" data-type="gold" style="left:400px;top:100px;">🟡</div>
    <div class="rock" data-type="stone" style="left:600px;top:150px;">🪨</div>
    <div class="rock diamond" data-type="diamond" style="left:750px;top:300px;">💎</div>
    <div class="rock coal" data-type="coal" style="left:150px;top:350px;">⬛</div>
    <div class="rock gold" data-type="gold" style="left:350px;top:400px;">🟡</div>
    <div class="rock" data-type="stone" style="left:550px;top:350px;">🪨</div>
    <div class="rock diamond" data-type="diamond" style="left:700px;top:100px;">💎</div>

    <div id="gameOver">
        <h2>🎉 TAMBANG SELESAI!</h2>
        <p>Kamu berhasil mengumpulkan banyak mineral!</p>
        <button onclick="location.reload()">🔄 Main Lagi</button>
    </div>

</div>

<div id="message">
    Gunakan ⬆️⬇️⬅️➡️ atau WASD untuk bergerak.
    Dekati batu untuk menambangnya!
</div>

<div id="shop">
    <button onclick="upgradeSpeed()">⚡ Upgrade Kecepatan — $50</button>
    <button onclick="sellMinerals()">💰 Jual Mineral</button>
</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");

let x = 30;
let y = 30;

let speed = 5;
let money = 0;

let stone = 0;
let gold = 0;
let diamond = 0;

let keys = {};

document.addEventListener("keydown", function(e) {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});

function movePlayer() {

    if (keys["arrowup"] || keys["w"]) {
        y -= speed;
    }

    if (keys["arrowdown"] || keys["s"]) {
        y += speed;
    }

    if (keys["arrowleft"] || keys["a"]) {
        x -= speed;
    }

    if (keys["arrowright"] || keys["d"]) {
        x += speed;
    }

    // Batas arena
    x = Math.max(0, Math.min(860, x));
    y = Math.max(0, Math.min(510, y));

    player.style.left = x + "px";
    player.style.top = y + "px";

    checkMining();

    requestAnimationFrame(movePlayer);
}

function checkMining() {

    const rocks = document.querySelectorAll(".rock");

    rocks.forEach(rock => {

        if (rock.dataset.mined === "true") return;

        const rx = rock.offsetLeft;
        const ry = rock.offsetTop;

        const distance = Math.sqrt(
            Math.pow(x - rx, 2) +
            Math.pow(y - ry, 2)
        );

        if (distance < 65) {

            mineRock(rock);

        }

    });
}

function mineRock(rock) {

    rock.dataset.mined = "true";

    const type = rock.dataset.type;

    if (type === "stone") {
        stone++;
        money += 5;
        showMessage("🪨 Kamu mendapatkan batu!");
    }

    if (type === "coal") {
        money += 10;
        showMessage("⬛ Kamu mendapatkan batu bara!");
    }

    if (type === "gold") {
        gold++;
        money += 30;
        showMessage("🟡 WOW! Kamu menemukan EMAS!");
    }

    if (type === "diamond") {
        diamond++;
        money += 100;
        showMessage("💎 LUAR BIASA! Kamu menemukan BERLIAN!");
    }

    rock.style.transform = "scale(0)";
    rock.style.transition = "0.3s";

    updateInfo();

    setTimeout(() => {
        rock.remove();
        checkWin();
    }, 300);
}

function updateInfo() {

    document.getElementById("money").textContent = money;
    document.getElementById("stone").textContent = stone;
    document.getElementById("gold").textContent = gold;
    document.getElementById("diamond").textContent = diamond;

}

function showMessage(text) {

    document.getElementById("message").textContent = text;

    setTimeout(() => {
        document.getElementById("message").textContent =
            "Gunakan ⬆️⬇️⬅️➡️ atau WASD untuk bergerak. Dekati batu untuk menambangnya!";
    }, 1500);

}

function upgradeSpeed() {

    if (money >= 50) {

        money -= 50;
        speed += 2;

        showMessage("⚡ Kecepatan berhasil ditingkatkan!");

        updateInfo();

    } else {

        showMessage("❌ Uang kamu belum cukup!");

    }

}

function sellMinerals() {

    const total =
        stone * 5 +
        gold * 30 +
        diamond * 100;

    if (total > 0) {

        money += total;

        stone = 0;
        gold = 0;
        diamond = 0;

        showMessage("💰 Semua mineral berhasil dijual!");

        updateInfo();

    } else {

        showMessage("❌ Kamu belum memiliki mineral!");

    }

}

function checkWin() {

    const rocks = document.querySelectorAll(".rock");

    if (rocks.length === 0) {

        document.getElementById("gameOver").style.display = "flex";

    }

}

movePlayer();

updateInfo();

</script>

</body>
</html>
